name: Watch TestFlight
on:
  workflow_dispatch:
  push:
    tags: ['watch-testflight-*']
permissions:
  contents: read
concurrency:
  group: watch-testflight
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
      BRAIN_DUMP_WATCH_API_URL: ${{ vars.BRAIN_DUMP_WATCH_API_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare build tools
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app
          brew install xcodegen
          python3 -m venv "$RUNNER_TEMP/signing-tools"
          "$RUNNER_TEMP/signing-tools/bin/pip" install codemagic-cli-tools==0.69.0
          echo "$RUNNER_TEMP/signing-tools/bin" >> "$GITHUB_PATH"
      - name: Fetch or create distribution signing files
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for name in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            test -n "${!name}" || { echo "Missing secret: $name"; exit 1; }
          done
          keychain initialize
          app-store-connect fetch-signing-files "$APP_BUNDLE_ID" --strict-match-identifier --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files "$APP_BUNDLE_ID.watchkitapp" --strict-match-identifier --type IOS_APP_STORE --create
          keychain add-certificates
      - name: Archive and export signed Watch app
        run: |
          export BUILD_NUMBER="$GITHUB_RUN_NUMBER.$GITHUB_RUN_ATTEMPT"
          bash brain-dump-watch/scripts/archive.sh
      - name: Upload build to App Store Connect
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: app-store-connect publish --path '/tmp/watch-export/*.ipa'
      # No --testflight: that flag submits for external beta review.
      # Select the processed build in the Internal group in App Store Connect.
