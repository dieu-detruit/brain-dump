[project]
name = "brain-dump-bridge"
version = "0.1.0"
description = "Local daemon that turns a generic push into a Brain Dump thread"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["brain-dump-sdk"]

[project.scripts]
brain-dump-bridge = "brain_dump_bridge.cli:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_dump_bridge"]

[tool.uv.sources]
brain-dump-sdk = { path = "../brain-dump-sdk" }
