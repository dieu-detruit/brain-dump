[project]
name = "brain-dump-history"
version = "0.1.0"
description = "Continuously archive Brain Dump history in a separate Git repository"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "brain-dump-sdk",
  "httpx>=0.27,<1",
  "supabase>=2.28,<3",
]

[project.scripts]
brain-dump-history = "brain_dump_history.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain_dump_history"]

[tool.uv.sources]
brain-dump-sdk = { path = "../brain-dump-sdk" }

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
